<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visitor Parking</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/parking.css" />
  </head>
  <body data-page="parking">
    <div class="app-layout">
      <aside class="app-sidebar" aria-label="Primary navigation">
        <div class="sidebar-brand">
          <div class="sidebar-mark">S</div>
          <div>
            <h2>SONIC</h2>
            <p>Security Operations</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item" data-nav="dashboard"><span class="nav-icon">D</span><span>Dashboard</span></a>
          <a href="parking.html" class="nav-item" data-nav="parking"><span class="nav-icon">P</span><span>Visitor Parking</span></a>
          <a href="incidents.html" class="nav-item" data-nav="incidents"><span class="nav-icon">I</span><span>Incident Reports</span></a>
          <a href="shift-logs.html" class="nav-item" data-nav="shift-logs"><span class="nav-icon">L</span><span>Security Shift Logs</span></a>
          <a href="admin.html" class="nav-item" data-nav="admin"><span class="nav-icon">A</span><span>Admin</span></a>
        </nav>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-footer sidebar-nav">
          <button id="logoutBtn" class="nav-item" type="button"><span class="nav-icon">O</span><span>Logout</span></button>
        </div>
      </aside>

      <div class="sidebar-overlay" aria-hidden="true"></div>

      <div class="app-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Visitor Parking</p>
            <h1>New Parking Pass</h1>
          </div>
          <button type="button" class="sidebar-toggle" data-sidebar-toggle>Menu</button>
        </header>

    <main class="form-shell">
      <section class="panel">
        <h2>Visitor Parking Details</h2>
        <p class="helper-text">Each Building + Unit combination is limited to 10 overnight parking days per month unless an exception is enabled.</p>
        <form id="parkingForm" class="parking-form">
          <label>
            Building
            <select name="building" required>
              <option value="">Select building</option>
              <option value="2 Sonic">2 Sonic</option>
              <option value="6 Sonic">6 Sonic</option>
            </select>
          </label>
          <label>
            Unit
            <input name="unit" type="text" required placeholder="Example: 12A" />
          </label>
          <label>
            Resident
            <input name="resident" type="text" required placeholder="Resident name" />
          </label>
          <label>
            Plate
            <input name="plate" type="text" required placeholder="ABC123" />
          </label>
          <label>
            Vehicle
            <input name="vehicle" type="text" required placeholder="Sedan, SUV, Truck" />
          </label>
          <label>
            Color
            <input name="color" type="text" required placeholder="Black" />
          </label>
          <label>
            Duration
            <select name="duration" required>
              <option value="0">Day-time (today until 11:59 PM)</option>
              <option value="1">1 Day</option>
              <option value="2">2 Days</option>
              <option value="3">3 Days</option>
            </select>
          </label>
          <label>
            Authorized By
            <input name="authorizedBy" type="text" required placeholder="Manager or owner" />
          </label>
          <button class="primary-btn" type="submit">Save Parking Pass</button>
        </form>
        <p id="formMessage" class="status-message" aria-live="polite"></p>
      </section>
      </main>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/parking.js"></script>
    <script src="js/navigation.js"></script>
  </body>
</html>
